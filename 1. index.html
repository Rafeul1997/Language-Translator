<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Speech to Text</h1>
    <p class="subtitle">Click the mic and start speaking...</p>

    <!-- Converted Text Output Box -->
    <div class="textbox-wrapper">
      <textarea id="outputText" placeholder="Your transcribed speech will appear here..." readonly></textarea>
      <button id="copyBtn" class="copy-btn">Copy Text</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="micBtn" class="mic-btn" aria-label="Toggle Microphone">
        <svg class="mic-icon" viewBox="0 0 24 24" width="32" height="32">
          <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
      </button>
      <span id="statusText" class="status-text">Click to Listen</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
