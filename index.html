<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text & Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

    <h1>🎤 Speech & Translator</h1>
    <p class="subtitle">
        Speak live or upload an audio file, then translate into any language.
    </p>

    <!-- Language Selection -->

    <div class="language-bar">

        <div class="lang-group">
            <label>Speaking:</label>

            <select id="sourceLangSelect">
                <option value="en-US|en">English</option>
                <option value="hi-IN|hi">Hindi</option>
                <option value="bn-IN|bn">Bengali</option>
                <option value="es-ES|es">Spanish</option>
                <option value="fr-FR|fr">French</option>
                <option value="de-DE|de">German</option>
                <option value="ja-JP|ja">Japanese</option>
                <option value="zh-CN|zh">Chinese</option>
                <option value="ar-SA|ar">Arabic</option>
                <option value="ru-RU|ru">Russian</option>
            </select>
        </div>

        <span class="arrow">➜</span>

        <div class="lang-group">

            <label>Translate To:</label>

            <select id="targetLangSelect">

                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="bn">Bengali</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>

            </select>

        </div>

    </div>

    <!-- Output -->

    <div class="textbox-wrapper">

        <textarea
            id="outputText"
            placeholder="Speech or transcription will appear here..."
        ></textarea>

        <button id="copyBtn" class="copy-btn">
            Copy
        </button>

    </div>

    <!-- Buttons -->

    <div class="action-buttons">

        <button id="translateBtn" class="translate-btn">
            🌐 Translate
        </button>

        <button
            id="showOriginalBtn"
            class="secondary-btn"
            style="display:none;"
        >
            ↩ Original
        </button>

    </div>

    <!-- Live Mic -->

    <div class="controls">

        <button
            id="micBtn"
            class="mic-btn">

            🎤

        </button>

        <span
            id="statusText"
            class="status-text">

            Click microphone to start

        </span>

    </div>

    <br>

    <hr>

    <br>

    <!-- Upload Audio -->

    <div class="upload-section">

        <button
            id="uploadAudioBtn"
            class="upload-btn">

            📁 Upload Audio File

        </button>

        <input
            type="file"
            id="audioFile"
            accept="audio/*"
            hidden>

    </div>

    <br>

    <!-- Audio Preview -->

    <audio
        id="audioPreview"
        controls
        style="display:none;width:100%;">
    </audio>

</div>

<script src="script.js"></script>

</body>
</html>
