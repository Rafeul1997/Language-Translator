<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Upload OpenAI Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="translator-container">
    <h2>OpenAI Multimodal Translator</h2>

    <!-- Target Language Selection -->
    <div class="input-group">
      <label for="targetLang">Target Language:</label>
      <select id="targetLang">
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Japanese">Japanese</option>
        <option value="Hindi">Hindi</option>
      </select>
    </div>

    <!-- Option 1: Live Microphone Recording -->
    <div class="input-group">
      <label>Option 1: Live Record Audio</label>
      <div class="record-controls">
        <button id="recordBtn" class="action-btn" onclick="startRecording()">🎤 Record</button>
        <button id="stopBtn" class="action-btn" onclick="stopRecording()" disabled>⏹️ Stop</button>
      </div>
    </div>

    <hr>

    <!-- Option 2: Upload Audio File -->
    <div class="input-group">
      <label for="audioFile">Option 2: Upload Audio File (.mp3, .wav, .m4a)</label>
      <input type="file" id="audioFile" accept="audio/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Audio Playback Preview Container -->
    <div class="input-group" id="playbackContainer" style="display:none;">
      <label>Audio Preview:</label>
      <audio id="audioPlayback" controls></audio>
    </div>

    <!-- Source Text Area / Transcription Box -->
    <div class="input-group">
      <label for="sourceText">Source Text / Transcription:</label>
      <textarea id="sourceText" placeholder="Type text, record live audio, or upload an audio file..."></textarea>
    </div>

    <button id="translateBtn" onclick="handleTranslation()">Translate Content</button>

    <!-- Output Section -->
    <div class="input-group">
      <label>Translated Output:</label>
      <div id="translatedOutput" class="output-box">Translation will appear here...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
