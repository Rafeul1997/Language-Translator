<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text & Translator (OpenAI API)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Speech & Translator</h1>
    <p class="subtitle">Powered by OpenAI Whisper & GPT</p>

    <!-- Language Selectors Row -->
    <div class="language-bar">
      <div class="lang-group">
        <label for="sourceLangSelect">Speaking:</label>
        <select id="sourceLangSelect">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="hi">Hindi</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <span class="arrow">➜</span>

      <div class="lang-group">
        <label for="targetLangSelect">Translate to:</label>
        <select id="targetLangSelect">
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Chinese">Chinese</option>
          <option value="Japanese">Japanese</option>
          <option value="Arabic">Arabic</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Russian">Russian</option>
        </select>
      </div>
    </div>

    <!-- Single Main Text Area -->
    <div class="textbox-wrapper">
      <textarea id="outputText" placeholder="Your transcribed speech will appear here..."></textarea>
      <button id="copyBtn" class="copy-btn">Copy Text</button>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button id="translateBtn" class="translate-btn">🌐 Translate Text</button>
      <button id="showOriginalBtn" class="secondary-btn" style="display: none;">↩ Show Original</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="input-controls-row">
        <!-- Mic Button -->
        <button id="micBtn" class="mic-btn" aria-label="Toggle Microphone" title="Record Live Speech">
          <svg class="mic-icon" viewBox="0 0 24 24" width="32" height="32">
            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
          </svg>
        </button>

        <!-- Audio File Upload Button -->
        <label for="audioFileInput" class="upload-btn" title="Upload Audio File">
          <svg viewBox="0 0 24 24" width="32" height="32">
            <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
          </svg>
          <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
        </label>
      </div>

      <span id="statusText" class="status-text">Click mic or upload an audio file to transcribe</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
